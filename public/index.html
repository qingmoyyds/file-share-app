<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FileShare - 文件共享平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<!-- ====== LOGIN ====== -->
<div id="loginPage" class="page active">
  <div class="login-card">
    <div class="login-brand">File<span>Share</span></div>
    <p class="login-sub">安全高效的文件共享平台</p>
    <form id="loginForm">
      <div class="input-group"><input type="text" id="username" placeholder="用户名" required autocomplete="username"></div>
      <div class="input-group"><input type="password" id="password" placeholder="密码" required autocomplete="current-password"></div>
      <button type="submit" id="loginBtn"><span>登 录</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      <p class="error-msg" id="loginError"></p>
    </form>
    <div class="login-hint">
      <div class="hint-row"><span class="badge admin">管理员</span><code>admin / admin123</code></div>
      <div class="hint-row"><span class="badge user">用户</span><code>user / user123</code></div>
    </div>
  </div>
</div>

<!-- ====== MAIN ====== -->
<div id="mainPage" class="page">
  <nav class="nav">
    <div class="nav-inner">
      <div class="brand">File<span>Share</span></div>
      <div class="nav-right">
        <span id="userBadge"></span>
        <a class="nav-link" href="https://space.bilibili.com/1403616179" target="_blank" title="Bilibili 主页">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.22 4.44A3.19 3.19 0 0121.9 6.9a4.5 4.5 0 010 5.1l-1.79 2.58a19.54 19.54 0 01-4.22 4.83l-.4.32a1.75 1.75 0 01-2.28 0l-.4-.32a19.54 19.54 0 01-4.22-4.83L4.1 12a4.5 4.5 0 010-5.1 3.19 3.19 0 013.68-2.46 6.33 6.33 0 014.22 3.2 6.33 6.33 0 014.22-3.2z"/></svg>
          B站主页
        </a>
        <button id="logoutBtn" class="btn-logout">退出</button>
      </div>
    </div>
  </nav>

  <!-- Admin Tabs -->
  <nav class="tabs" id="adminTabs" style="display:none">
    <button class="tab active" data-tab="files">文件管理</button>
    <button class="tab" data-tab="users">用户管理</button>
  </nav>

  <div class="container">
    <!-- Files Panel -->
    <div id="filesPanel" class="tab-panel active">
      <div id="uploadSection" class="card upload-card" style="display:none">
        <h3 class="card-title">上传文件</h3>
        <form id="uploadForm">
          <div class="dropzone" id="dropZone">
            <div class="drop-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4M5 11l7-7 7 7"/><path d="M3 17v2a2 2 0 002 2h14a2 2 0 002-2v-2"/></svg></div>
            <p class="drop-text">拖拽文件到此处<span class="divider">|</span>点击选择</p>
            <p class="drop-hint">支持批量上传，单文件最大 500MB</p>
            <input type="file" id="fileInput" multiple>
          </div>
          <div class="file-name" id="fileName"></div>
          <button type="submit" id="uploadBtn" class="btn btn-primary full" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            开始上传
          </button>
          <progress id="uploadProgress" value="0" max="100" style="display:none"></progress>
          <p class="error-msg" id="uploadError"></p>
        </form>
      </div>

      <div class="stats-bar" id="statsBar" style="display:none">
        <div class="stat"><span class="stat-val" id="statFileCount">0</span><span class="stat-lbl">文件总数</span></div>
        <div class="stat"><span class="stat-val" id="statTotalSize">0 B</span><span class="stat-lbl">总大小</span></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3 class="card-title">文件列表</h3>
          <div class="card-head-right">
            <div class="search-box">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="text" id="searchInput" placeholder="搜索...">
            </div>
            <button id="refreshBtn" class="btn-icon" title="刷新">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
            </button>
          </div>
        </div>
        <div id="fileList" class="file-list">
          <div class="skeleton-list" id="skeletonLoading">
            <div class="sk-item"><div class="sk-line w60"></div><div class="sk-line w30"></div></div>
            <div class="sk-item"><div class="sk-line w70"></div><div class="sk-line w25"></div></div>
            <div class="sk-item"><div class="sk-line w50"></div><div class="sk-line w35"></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Users Panel -->
    <div id="usersPanel" class="tab-panel">
      <div class="card">
        <h3 class="card-title">添加用户</h3>
        <form id="addUserForm">
          <div class="user-form-row">
            <input type="text" id="newUsername" placeholder="用户名" required>
            <input type="password" id="newPassword" placeholder="密码" required>
            <select id="newUserRole"><option value="user">普通用户</option><option value="admin">管理员</option></select>
            <button type="submit" class="btn btn-primary">添加用户</button>
          </div>
          <p class="error-msg" id="addUserError"></p>
        </form>
      </div>
      <div class="card">
        <div class="card-head">
          <h3 class="card-title">用户列表</h3>
          <button id="refreshUsersBtn" class="btn-icon" title="刷新">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
          </button>
        </div>
        <div class="table-wrap">
          <table class="user-table">
            <thead><tr><th>用户名</th><th>角色</th><th>操作</th></tr></thead>
            <tbody id="userTableBody"><tr><td colspan="3" class="empty-cell">加载中...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 FileShare. All rights reserved.</footer>
</div>

<!-- Password Modal -->
<div id="pwModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-head"><h3>修改密码 — <span id="pwModalUser"></span></h3><button id="pwModalClose" class="btn-icon">&times;</button></div>
    <form id="pwResetForm">
      <div class="input-group"><input type="password" id="resetPassword" placeholder="新密码（至少 3 位）" required minlength="3"></div>
      <button type="submit" class="btn btn-primary full">确认修改</button>
      <p class="error-msg" id="resetPwError"></p>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
