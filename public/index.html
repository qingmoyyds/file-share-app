<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AE买量脚本 - 官方主页</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="AE买量脚本官方主页 - 合成/三消/RTS自动化生成工具">
<style>
  :root {
    --bg: #0f0f11;
    --card: #1e1e20;
    --accent: #3ea6ff;
    --text-main: #f0f0f0;
    --text-sub: #888888;
    --border: #333333;
    --btn-primary: #3ea6ff;
    --btn-primary-hover: #60b5ff;
    --tag-blue: rgba(62, 166, 255, 0.15); --tag-blue-text: #3ea6ff;
    --tag-purple: rgba(168, 85, 247, 0.15); --tag-purple-text: #d8b4fe;
    --tag-orange: rgba(249, 115, 22, 0.15); --tag-orange-text: #fdba74;
  }

  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text-main); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .nav { width: 100%; padding: 15px 0 5px 0; text-align: center; border-bottom: 1px solid var(--border); background: rgba(15, 15, 17, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
  .nav-inner { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow: hidden; }
  .brand { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #fff; margin-bottom: 5px; }
  .brand span { color: var(--accent); }
  .notice { font-size: 12px; color: #f87171; font-weight: 600; }

  .product-matrix { display: flex; gap: 12px; width: 100%; max-width: 100%; overflow-x: auto; padding: 0 20px 15px 20px; box-sizing: border-box; justify-content: flex-start; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .product-matrix::-webkit-scrollbar { display: none; }
  @media(min-width: 600px) { .product-matrix { justify-content: center; overflow-x: visible; } }

  .tag { font-size: 13px; padding: 8px 16px; border-radius: 8px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; cursor: pointer; transition: all 0.3s; opacity: 0.5; filter: grayscale(0.4); background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); flex-shrink: 0; }
  .tag:hover { opacity: 0.8; transform: translateY(-2px); }
  .tag.active { opacity: 1; filter: grayscale(0); transform: scale(1.05); box-shadow: 0 5px 20px rgba(0,0,0,0.5); border-width: 1px; }
  .tag.active.blue   { background: var(--tag-blue); color: var(--tag-blue-text); border-color: var(--tag-blue-text); box-shadow: 0 0 15px rgba(62, 166, 255, 0.2); }
  .tag.active.purple { background: var(--tag-purple); color: var(--tag-purple-text); border-color: var(--tag-purple-text); box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); }
  .tag.active.orange { background: var(--tag-orange); color: var(--tag-orange-text); border-color: var(--tag-orange-text); box-shadow: 0 0 15px rgba(249, 115, 22, 0.2); }
  .tag.gray { opacity: 0.3; cursor: default; border: 1px dashed #555; }

  .container { max-width: 800px; width: 90%; margin: 30px auto; flex: 1; }

  .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.6); margin-bottom: 40px; position: relative; display: flex; align-items: center; justify-content: center; }
  .video-container iframe { width: 100%; height: 100%; border: none; }

  .empty-state { text-align: center; color: var(--text-sub); animation: fadeIn 0.5s; padding: 20px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; transition: opacity 0.2s ease; }
  .card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; transition: all 0.3s; display: flex; flex-direction: column; }
  .card:hover { transform: translateY(-5px); border-color: #555; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .card-media { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; overflow: hidden; }
  .card-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
  .card:hover .card-media img { transform: scale(1.05); }
  .card-content { padding: 15px; flex: 1; display: flex; flex-direction: column; }
  .card h3 { margin: 0 0 8px 0; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .card p { margin: 0; font-size: 13px; color: var(--text-sub); line-height: 1.6; }

  .ui-section { margin-bottom: 40px; text-align: center; opacity: 1; transition: opacity 0.3s; }
  .ui-title { font-size: 14px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; font-weight: 700; }
  .ui-image-box { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.5); background: #151515; }
  .ui-image-box img { width: 100%; height: auto; display: block; }

  .comparison-box { margin: 0 auto 50px auto; width: 100%; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #151515; }
  .comp-row { display: flex; border-bottom: 1px solid #333; }
  .comp-row:last-child { border-bottom: none; }
  .comp-col { flex: 1; padding: 15px 10px; text-align: center; font-size: 13px; display: flex; align-items: center; justify-content: center; color: #ccc; }
  .comp-col.feature { flex: 1.2; justify-content: flex-start; text-align: left; color: #fff; font-weight: 600; padding-left: 20px; }
  .comp-header { background: #222; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .col-free { color: #aaa; }
  .col-pro { color: var(--accent); position: relative; font-weight: 800; }
  .check { color: #4cd964; font-weight: bold; font-size: 16px; }
  .cross { color: #555; font-size: 14px; opacity: 0.5; }
  .limit { color: #eebb00; font-size: 12px; border: 1px solid rgba(238, 187, 0, 0.3); padding: 2px 6px; border-radius: 4px; background: rgba(238, 187, 0, 0.1); }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 60px; }
  .btn { cursor: pointer; text-decoration: none; padding: 14px 20px; border-radius: 30px; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; border: none; outline: none; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
  .btn:active { transform: scale(0.96); }
  .btn-download { width: 100%; background: var(--btn-primary); color: #fff; box-shadow: 0 10px 25px rgba(62, 166, 255, 0.3); font-size: 17px; }
  .btn-download:hover { background: var(--btn-primary-hover); transform: translateY(-2px); box-shadow: 0 15px 35px rgba(62, 166, 255, 0.4); }
  .btn-download.disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; pointer-events: none; }
  .btn-equal { flex: 1; min-width: 0; padding-left: 10px; padding-right: 10px; font-size: 13px; }
  .btn-bilibili { background: #fb7299; color: #fff; box-shadow: 0 5px 15px rgba(251, 114, 153, 0.2); }
  .btn-bilibili:hover { background: #f95886; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(251, 114, 153, 0.4); }
  .btn-secondary { background: rgba(255,255,255,0.08); color: #ccc; border: 1px solid rgba(255,255,255,0.1); }
  .btn-secondary:hover { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }
  footer { margin-top: auto; padding: 30px; text-align: center; font-size: 12px; color: #444; width: 100%; border-top: 1px solid #222; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <div class="brand">AE买量 <span>脚本</span></div>
    <div class="notice" id="noticeBar"></div>
    <div class="product-matrix" id="tagBar"></div>
  </div>
</div>

<div class="container">
  <div class="video-container" id="main-screen"></div>
  <div class="grid" id="card-grid"></div>
  <div class="ui-section" id="ui-section" style="display:none">
    <div class="ui-title">// 界面预览 & 版本对比 //</div>
    <div class="ui-image-box" id="ui-preview-box"></div>
  </div>
  <div class="comparison-box" id="comp-section"></div>
  <div class="actions" id="actionBar"></div>
</div>

<footer>Designed by Gary &copy; 2025<br>仅供学习交流，请支持正版</footer>

<script>
const API = 'https://ceshishiyong-d1gb3vg9y56ee3be6.service.tcloudbase.com/apiv2';
let DATA = null;
let currentKey = 'merge';

async function init() {
  try {
    const r = await fetch(API+'/api/content', { credentials:'include' });
    DATA = await r.json();
    if (!DATA || !DATA.products) return;
    renderPage();
    switchTab('merge');
  } catch(e) { console.error(e); }
}

function renderPage() {
  // Notice
  document.getElementById('noticeBar').textContent = DATA.notice || '';

  // Tags
  const tagBar = document.getElementById('tagBar');
  tagBar.innerHTML = '';
  const colors = ['blue','purple','orange'];
  let idx = 0;
  for (const [key, prod] of Object.entries(DATA.products || {})) {
    const c = colors[idx] || 'blue';
    const tag = document.createElement('div');
    tag.className = `tag ${c}`;
    tag.textContent = prod.label || key;
    tag.onclick = () => switchTab(key);
    tagBar.appendChild(tag);
    idx++;
  }
  const more = document.createElement('div');
  more.className = 'tag gray';
  more.textContent = '🚧 更多开发中...';
  tagBar.appendChild(more);

  // Comparison table
  const comp = document.getElementById('comp-section');
  if (DATA.comparison && DATA.comparison.length > 0) {
    let h = '<div class="comp-row comp-header"><div class="comp-col feature">功能特性</div><div class="comp-col col-free">免费版</div><div class="comp-col col-pro">Pro 专业版</div></div>';
    for (const row of DATA.comparison) {
      const isCheck = row.pro.includes('✓') || row.pro.includes('✔') || (!row.pro.includes('✕') && row.pro.length > 0 && row.pro !== '无' && row.pro !== '不支持');
      const proCls = row.pro.includes('✕') ? 'cross' : 'check';
      const freeCls = row.free.includes('✕') ? 'cross' : (row.free.includes('限制') || row.free.includes('仅')) ? 'limit' : 'check';
      h += `<div class="comp-row"><div class="comp-col feature">${esc(row.feature)}</div><div class="comp-col"><span class="${freeCls}">${esc(row.free)}</span></div><div class="comp-col"><span class="${proCls}">${esc(row.pro)}</span></div></div>`;
    }
    comp.innerHTML = h;
  }

  // Action buttons
  const ab = document.getElementById('actionBar');
  ab.innerHTML = `
    <a href="#" id="btn-download" class="btn btn-download"><span>🚀 立即下载</span></a>
    <a href="${esc(DATA.bilibili||'#')}" target="_blank" class="btn btn-bilibili btn-equal"><span>📺 B站主页</span></a>
    <button class="btn btn-secondary btn-equal" onclick="contactQQ()"><span>🐧 QQ咨询</span></button>
    <a href="${esc(DATA.groupLink||'#')}" target="_blank" class="btn btn-secondary btn-equal"><span>👥 售后群</span></a>`;
}

function switchTab(key) {
  currentKey = key;
  const tags = document.querySelectorAll('.tag:not(.gray)');
  const keys = Object.keys(DATA.products || {});
  tags.forEach((t, i) => { t.classList.toggle('active', keys[i] === key); });

  const prod = DATA.products[key];
  if (!prod) return;

  // Video
  const vc = document.getElementById('main-screen');
  const bvid = prod.bvid || DATA.defaultBvid || 'BV18J4m1h7gN';
  vc.innerHTML = `<iframe src="//player.bilibili.com/player.html?bvid=${bvid}&page=1&high_quality=1&danmaku=0&autoplay=0" scrolling="no" allowfullscreen="true" sandbox="allow-top-navigation allow-same-origin allow-forms allow-scripts"></iframe>`;

  // Cards
  const grid = document.getElementById('card-grid');
  grid.style.opacity = '0.5';
  setTimeout(() => {
    let h = '';
    for (const c of (prod.cards || [])) {
      const media = c.img ? `<img src="${esc(c.img)}">` : `<div style="width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;color:#444;font-size:30px">${c.icon}</div>`;
      h += `<div class="card"><div class="card-media">${media}</div><div class="card-content"><h3>${c.icon} ${esc(c.title)}</h3><p>${esc(c.desc)}</p></div></div>`;
    }
    grid.innerHTML = h;
    grid.style.opacity = '1';
  }, 150);

  // Screenshot
  const ui = document.getElementById('ui-section');
  const uibox = document.getElementById('ui-preview-box');
  if (prod.screenshot) {
    uibox.innerHTML = `<img src="${esc(prod.screenshot)}" alt="UI">`;
    ui.style.display = 'block';
  } else {
    ui.style.display = 'none';
  }

  // Download button
  const btn = document.getElementById('btn-download');
  const nb = btn.cloneNode(true);
  btn.parentNode.replaceChild(nb, btn);
  if (prod.downUrl) {
    nb.classList.remove('disabled');
    nb.innerHTML = '<span>🚀 立即下载正式版</span>';
    nb.onclick = () => downloadScript(prod.downUrl, prod.downPwd);
    nb.removeAttribute('href');
  } else {
    nb.classList.add('disabled');
    nb.innerHTML = '<span>🕒 敬请期待</span>';
    nb.onclick = null;
  }
}

function contactQQ() {
  const qq = DATA.qq || '2942029576';
  // Copy to clipboard
  if (navigator.clipboard) {
    navigator.clipboard.writeText(qq).then(() => {
      showQQModal(qq);
    }).catch(() => showQQModal(qq));
  } else {
    showQQModal(qq);
  }
}

function showQQModal(qq) {
  // Remove existing modal
  const old = document.getElementById('qq-modal');
  if (old) old.remove();

  const overlay = document.createElement('div');
  overlay.id = 'qq-modal';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease;';
  overlay.innerHTML = `
    <div style="background:#1e1e20;border:1px solid #333;border-radius:16px;padding:36px;text-align:center;max-width:360px;width:90%;animation:modalIn .3s ease;">
      <div style="font-size:48px;margin-bottom:16px;">🐧</div>
      <h3 style="color:#fff;margin-bottom:8px;">添加 QQ 好友</h3>
      <p style="color:#888;font-size:13px;margin-bottom:20px;">QQ号已复制到剪贴板<br>请在 QQ 中搜索该号码添加好友</p>
      <div style="background:rgba(255,255,255,.04);border:1px solid #333;border-radius:10px;padding:16px;margin-bottom:20px;">
        <span style="font-size:28px;font-weight:900;color:#3ea6ff;letter-spacing:2px;">${qq}</span>
      </div>
      <button onclick="document.getElementById('qq-modal').remove()" style="width:100%;padding:14px;border-radius:30px;background:#3ea6ff;color:#fff;font-weight:700;font-size:16px;border:none;cursor:pointer;">知道了</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

function downloadScript(url, pwd) {
  if (!url) return;
  if (pwd) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(pwd).then(() => {
        alert('✅ 提取码 [' + pwd + '] 已自动复制！\n\n即将跳转网盘，请粘贴提取码。');
        window.open(url, '_blank');
      }).catch(() => { prompt('请手动复制提取码：', pwd); window.open(url, '_blank'); });
    } else { prompt('请手动复制提取码：', pwd); window.open(url, '_blank'); }
  } else { window.open(url, '_blank'); }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

init();
</script>
</body>
</html>
